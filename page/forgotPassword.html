<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <section class="login" id="login">
        <!-- PHẦN ẢNH LỚN -->
        <div class="container-image">
            <img src="/assets/img/mountain.jpg" class="image-mountain">
        </div>

        <!-- PHẦN ĐĂNG NHẬP -->
        <div class="container">
            <div class="container-login">
                <img src="/assets/img/logoRikkei.png" class="logo">
                <h1>Quên Mật khẩu<h1>
                <form class="input-group">
                    <label for="email">Email</label>
                    <div class="input-box">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" placeholder=" you@company.com" autocomplete="username"
                            id="input-name-sign-in">
                    </div>
                    <button style="margin-bottom: 10px;" type="button" id="btn-login">Xác Nhận</button>
                    <p>Quay Lại Đăng Nhập <a style="cursor: pointer;" onclick="signOut()">Đăng nhập</a></p>
                </form>
            </div>
        </div>
    </section>
</body>
<script src="/js/turnPage.js"></script>
</html>
